name: partime_map_explorer
description: "A clean Flutter mobile application for exploring interactive dark maps with OpenFreeMap and MapLibre."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  maplibre_gl: ^0.27.1
  geolocator: ^13.0.2
  permission_handler: ^11.3.1
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
